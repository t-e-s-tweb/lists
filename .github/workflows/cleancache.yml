name: Cache Cleanup
on:
  schedule:
    - cron: '0 2 * * 1'  # Monday 2am
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: LeRedTeam/cache-doctor@v1
        with:
          mode: cleanup
          stale-days: '7'
          delete-orphans: 'true'
